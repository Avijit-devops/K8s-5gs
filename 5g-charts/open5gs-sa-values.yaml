          matchExpressions:
          - key: role
            operator: In
            values:
            - primary

  config:
    nsiList:
      - uri: http://open5gs-nrf-sbi:7777
        sst: 1
        sd: "000001"

  services:
    sbi:
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800

