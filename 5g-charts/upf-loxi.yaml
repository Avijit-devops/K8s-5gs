apiVersion: v1
kind: Service
metadata:
  name: open5gs-upf-gtpu-loxi
  namespace: open5gs
  annotations:
    loxilb.io/staticIP: "192.168.1.53"
    loxilb.io/lbmode: "fullnat"

spec:
  type: LoadBalancer
  loadBalancerClass: loxilb.io/loxilb

  selector:
    app.kubernetes.io/instance: open5gs
    app.kubernetes.io/name: upf

  ports:
  - name: gtpu
    port: 2152
    protocol: UDP
    targetPort: gtpu
